<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>mis mierdas</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <main class="contenedor">
    <header class="cabecera-principal">
  <h1>mis mierdas</h1>
  <nav class="pestanas">
    <button id="btn-peliculas" class="btn-pestana activa">Películas</button>
    <button id="btn-lecturas" class="btn-pestana">Lecturas</button>
  </nav>
</header>
    <header class="cabecera">
      <h1>Las películas</h1>
      <p id="contador">cargando películas...</p>
    </header>

    <label class="busqueda">
      <span class="texto-oculto">buscar por título</span>
      <input
        id="buscar"
        type="search"
        placeholder="Buscar película..."
        autocomplete="off"
      >
    </label>

    <section id="peliculas" class="lista" aria-live="polite"></section>

    <p id="sin-resultados" class="sin-resultados oculto">
      no se encontraron películas.
    </p>
  </main>

  <script src="app.js"></script>
</body>
</html>
